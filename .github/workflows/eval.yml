# EVAL-007: Eval Gate CI Workflow
# ADR-103: Evaluation Gate

name: Eval Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  eval-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Eval Gate
        id: eval
        run: |
          python -m pytest tests/eval_suite/ -v -m eval --tb=short --junitxml=eval-results.xml
        continue-on-error: true

      - name: Generate Report
        if: always()
        run: |
          python tests/eval_suite/runner.py > eval-report.md 2>&1 || true
          cat eval-report.md

      - name: Upload Eval Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            eval-results.xml
            eval-report.md

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '## Eval Gate Results\n\n';

            try {
              report += fs.readFileSync('eval-report.md', 'utf8');
            } catch (e) {
              report += '⚠️ Report generation failed. Check workflow logs.';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

      - name: Check Eval Gate Status
        if: steps.eval.outcome == 'failure'
        run: |
          echo "❌ Eval Gate failed. Blocking deployment."
          exit 1

      - name: Eval Gate Passed
        if: steps.eval.outcome == 'success'
        run: |
          echo "✅ Eval Gate passed. Safe to deploy."
